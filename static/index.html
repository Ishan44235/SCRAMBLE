<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCRAMBLE</title><link rel="stylesheet" href="/static/css/style.css"><header><a id="aircraft-logo" href="/" aria-label="Return to lobby">✈ <strong>SCRAMBLE</strong></a></header><main><h1>SCRAMBLE</h1><p>BUILD YOUR AIRCRAFT. FLY YOUR MISSION.</p><section class="panel"><button id="host">HOST GAME</button><a class="button" href="/rules">RULES</a><h2>JOIN GAME</h2><input id="code" aria-label="Room code" placeholder="ROOM CODE" maxlength="4"><input id="name" aria-label="Pilot name" placeholder="PILOT NAME" maxlength="14"><button id="join">JOIN ROOM</button><p id="status" role="status"></p></section></main><script src="/static/js/navigation.js"></script><script>document.getElementById('host').onclick=async()=>{try{let r=await fetch('/api/room',{method:'POST'});let j=await r.json();sessionStorage.setItem('scramble_host_code',j.code);location.assign('/host?code='+encodeURIComponent(j.code))}catch(e){document.getElementById('status').textContent='Unable to create room'}};document.getElementById('join').onclick=()=>{const code=document.getElementById('code').value.trim().toUpperCase(),name=document.getElementById('name').value.trim()||'PILOT';if(code.length!==4){document.getElementById('status').textContent='Enter a four-character room code';return}sessionStorage.setItem('scramble_player_name',name);sessionStorage.removeItem('scramble_player_pid');location.assign('/play?code='+encodeURIComponent(code))}</script></html>
