<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>SCRAMBLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="arcade">

<canvas id="sky"></canvas>
<div class="crt"></div>

<div class="home">
  <header class="home-head">
    <canvas id="hero" class="hero"></canvas>
    <h1 class="title">
      <span class="t1">SCRAMBLE<span class="blink">_</span></span>
    </h1>
    <div class="subtitle">ANSWER · BUILD · DOGFIGHT</div>
  </header>

  <div class="home-panel" id="panelChoose">
    <button class="arcade-btn big" id="btnHost">
      <span class="ab-top">HOST GAME</span>
      <span class="ab-sub">PUT IT ON THE BIG SCREEN</span>
    </button>
    <button class="arcade-btn big ghost" id="btnJoin">
      <span class="ab-top">JOIN GAME</span>
      <span class="ab-sub">GOT A ROOM CODE?</span>
    </button>
  </div>

  <div class="home-panel" id="panelJoin" style="display:none">
    <div class="code-label">ENTER ROOM CODE</div>
    <input type="text" id="codeInput" class="code-input" maxlength="4"
           autocomplete="off" autocapitalize="characters" spellcheck="false"
           inputmode="text" placeholder="----">
    <div class="code-err" id="codeErr"></div>
    <button class="arcade-btn" id="btnGo">LOCK ON</button>
    <button class="arcade-btn ghost sm" id="btnBack">BACK</button>
  </div>

  <a class="howto-btn" href="/rules">
    <span class="hb-q">?</span>
    <span class="hb-t">HOW TO PLAY</span>
    <span class="hb-a">→</span>
  </a>

  <footer class="home-foot">
    <span class="status-light ok"></span> FLIGHT CONTROL ONLINE
    <span class="ticker" id="ticker"></span>
  </footer>
</div>

<script src="/static/js/skyfield.js"></script>
<script src="/static/js/hero.js"></script>
<script>
const $ = id => document.getElementById(id);
startSky(document.getElementById('sky'));
startHero(document.getElementById('hero'));

/* scrolling flight-control chatter along the bottom */
const LINES = [
  'RWY 24 CLEARED FOR DEPARTURE',
  'MACH 2.04 — AFTERBURNER NOMINAL',
  'BOGEY BEARING 270 · ANGELS 12',
  'PARTS BAY PRESSURISED',
  'FOX TWO · FOX TWO',
  'TRIM CHECK OK · GEAR UP',
  'WINGMAN SQUAWKING UNKNOWN',
  'MERGE IN 3 · 2 · 1',
];
let ti = 0;
function ticker() {
  $('ticker').textContent = '// ' + LINES[ti % LINES.length];
  ti++;
  setTimeout(ticker, 2600);
}
ticker();

/* ------------------------------------------------- host / join flow */
$('btnHost').onclick = async () => {
  $('btnHost').disabled = true;
  $('btnHost').querySelector('.ab-top').textContent = 'SPINNING UP…';
  try {
    const res = await fetch('/api/room', { method: 'POST' });
    const d = await res.json();
    location.href = '/host?code=' + d.code + '&token=' + encodeURIComponent(d.hostToken);
  } catch (e) {
    $('btnHost').disabled = false;
    $('btnHost').querySelector('.ab-top').textContent = 'HOST GAME';
    $('codeErr').textContent = 'COULD NOT REACH FLIGHT CONTROL';
  }
};

$('btnJoin').onclick = () => {
  $('panelChoose').style.display = 'none';
  $('panelJoin').style.display = 'flex';
  $('codeInput').focus();
};
$('btnBack').onclick = () => {
  $('panelJoin').style.display = 'none';
  $('panelChoose').style.display = 'flex';
  $('codeErr').textContent = '';
};

$('codeInput').addEventListener('input', e => {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  $('codeErr').textContent = '';
});
$('codeInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('btnGo').click();
});

$('btnGo').onclick = async () => {
  const code = $('codeInput').value.trim().toUpperCase();
  if (code.length !== 4) {
    $('codeErr').textContent = 'FOUR CHARACTERS';
    return;
  }
  $('btnGo').disabled = true;
  try {
    const res = await fetch('/api/room/' + code);
    if (!res.ok) {
      $('codeErr').textContent = 'NO SUCH ROOM';
      $('btnGo').disabled = false;
      return;
    }
    location.href = '/play?code=' + code;
  } catch (e) {
    $('codeErr').textContent = 'CONNECTION LOST';
    $('btnGo').disabled = false;
  }
};

// arriving from a QR code with the room already chosen
const pre = new URLSearchParams(location.search).get('code');
if (pre) location.replace('/play?code=' + pre.toUpperCase());
</script>
</body>
</html>
